{% extends "base.html" %}

{% block title %}Registrieren{% endblock %}

{% block head %}
<style>
    .auth-container {
        max-width: 420px;
        margin: 2.5rem auto;
        padding: 2.2rem;
    }
    .auth-title {
        text-align: center;
        color: var(--accent-gold);
        margin-bottom: 1.8rem;
        font-size: 1.6rem;
    }
    .form-field {
        margin-bottom: 1.2rem;
    }
    .form-field label {
        display: block;
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
        font-weight: 500;
    }
    .form-field input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        color: var(--text-light);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
        min-height: 46px; /* Touch friendly */
    }
    .form-field input:focus {
        border-color: var(--accent-gold);
    }
    .auth-submit {
        width: 100%;
        justify-content: center;
        margin-top: 0.5rem;
    }
    .auth-switch {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.92rem;
        color: var(--text-muted);
    }
    .flash-card.error { border-left-color: #d96b27; }
    .flash-card.success { border-left-color: #27ae60; }

    @media (max-width: 500px) {
        .auth-container {
            padding: 1.25rem 1rem;
            margin: 1rem auto;
            border-radius: var(--radius-sm);
        }

        .auth-title {
            font-size: 1.35rem;
            margin-bottom: 1.2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card auth-container">
    <h1 class="auth-title"><i class="fa-solid fa-user-plus"></i> Konto erstellen</h1>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="deine@email.de">
        </div>

        <div class="form-field">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Mind. 8 Zeichen">
        </div>

        <div class="form-field">
            <label for="password_confirm">Passwort wiederholen</label>
            <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" placeholder="Passwort nochmals eingeben">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
            <i class="fa-solid fa-user-plus"></i> Registrieren
        </button>
    </form>

    <p class="auth-switch">
        Schon ein Konto? <a href="{{ url_for('login') }}">Jetzt anmelden</a>
    </p>
</div>
{% endblock %}
