{% extends "base.html" %}

{% block title %}Buch hinzufügen{% endblock %}

{% block head %}
<style>
    .admin-container {
        max-width: 560px;
        margin: 2rem auto;
        padding: 2.5rem;
    }
    .admin-title {
        color: var(--accent-gold);
        margin-bottom: 1.8rem;
        font-size: 1.5rem;
    }
    .form-field {
        margin-bottom: 1.2rem;
    }
    .form-field label {
        display: block;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
    }
    .form-field input {
        width: 100%;
        padding: 0.7rem 1rem;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        color: var(--text-light);
        font-size: 1rem;
        outline: none;
    }
    .form-field input:focus {
        border-color: var(--accent-gold);
    }
</style>
{% endblock %}

{% block content %}
<div class="card admin-container">
    <h1 class="admin-title"><i class="fa-solid fa-book-medical"></i> Buch hinzufügen</h1>

    <form method="POST" action="{{ url_for('admin_books') }}">
        <div class="form-field">
            <label for="title">Titel</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="form-field">
            <label for="author">Autor</label>
            <input type="text" id="author" name="author" required>
        </div>

        <div class="form-field">
            <label for="thumbnail_url">Cover-URL (optional)</label>
            <input type="url" id="thumbnail_url" name="thumbnail_url" placeholder="https://...">
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Buch hinzufügen
        </button>
    </form>
</div>
{% endblock %}
