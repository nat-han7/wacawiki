{% extends "base.html" %}

{% block title %}Buch hinzufügen{% endblock %}

{% block head %}
<style>
    .admin-container {
        max-width: 560px;
        margin: 2rem auto;
        padding: 2.2rem;
    }

    .admin-title {
        color: var(--accent-gold);
        margin-bottom: 1.8rem;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .form-field {
        margin-bottom: 1.25rem;
    }

    .form-field label {
        display: block;
        font-size: 0.88rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
        font-weight: 500;
    }

    .form-field input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        color: var(--text-light);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
        min-height: 46px; /* Touch friendly */
    }

    .form-field input:focus {
        border-color: var(--accent-gold);
    }

    .admin-submit-btn {
        width: 100%;
        margin-top: 0.5rem;
    }

    @media (max-width: 500px) {
        .admin-container {
            padding: 1.25rem 1rem;
            margin: 1rem auto;
            border-radius: var(--radius-sm);
        }

        .admin-title {
            font-size: 1.25rem;
            margin-bottom: 1.2rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card admin-container">
    <h1 class="admin-title"><i class="fa-solid fa-book-medical"></i> Buch hinzufügen</h1>

    <form method="POST" action="{{ url_for('admin_books') }}">
        <div class="form-field">
            <label for="title">Titel</label>
            <input type="text" id="title" name="title" placeholder="z. B. In die Wildnis" required>
        </div>

        <div class="form-field">
            <label for="author">Autor</label>
            <input type="text" id="author" name="author" placeholder="z. B. Erin Hunter" required>
        </div>

        <div class="form-field">
            <label for="thumbnail_url">Cover-URL (optional)</label>
            <input type="url" id="thumbnail_url" name="thumbnail_url" placeholder="https://...">
        </div>

        <button type="submit" class="btn btn-primary admin-submit-btn">
            <i class="fa-solid fa-plus"></i> Buch hinzufügen
        </button>
    </form>
</div>
{% endblock %}
