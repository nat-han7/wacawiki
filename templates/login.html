{% extends "base.html" %}

{% block title %}Anmelden{% endblock %}

{% block head %}
<style>
    .auth-container {
        max-width: 420px;
        margin: 3rem auto;
        padding: 2.5rem;
    }
    .auth-title {
        text-align: center;
        color: var(--accent-gold);
        margin-bottom: 1.8rem;
        font-size: 1.6rem;
    }
    .form-field {
        margin-bottom: 1.2rem;
    }
    .form-field label {
        display: block;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
    }
    .form-field input {
        width: 100%;
        padding: 0.7rem 1rem;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        color: var(--text-light);
        font-size: 1rem;
        outline: none;
    }
    .form-field input:focus {
        border-color: var(--accent-gold);
    }
    .auth-submit {
        width: 100%;
        justify-content: center;
        margin-top: 0.5rem;
    }
    .auth-switch {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--text-muted);
    }
    .flash-card.error { border-left-color: #d96b27; }
    .flash-card.success { border-left-color: #27ae60; }
</style>
{% endblock %}

{% block content %}
<div class="card auth-container">
    <h1 class="auth-title"><i class="fa-solid fa-right-to-bracket"></i> Anmelden</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <div class="form-field">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-field">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary auth-submit">
            <i class="fa-solid fa-right-to-bracket"></i> Anmelden
        </button>
    </form>

    <p class="auth-switch">
        Noch kein Konto? <a href="{{ url_for('register') }}">Jetzt registrieren</a>
    </p>
</div>
{% endblock %}
